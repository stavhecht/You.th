# Weekly pull requests for dependency updates, grouped so a quiet week is one
# PR per ecosystem and not twenty. Security fixes come as their own PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    # Held by the caps in backend/pyproject.toml: neither has a test that makes a
    # real call, so green CI says nothing about them. Lift the cap, then delete these.
    ignore:
      - dependency-name: anthropic
        update-types: ["version-update:semver-major"]
      - dependency-name: huggingface-hub
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
