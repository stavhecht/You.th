<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You.th — simplifying your way to stay young</title>
    <meta
      name="description"
      content="Health, skincare and training claims read against the studies behind them. Every article is reviewed by a person before it is published."
    />
    <link rel="icon" href="/media/you.th-logo.png" />

    <!-- Fonts (Instrument Serif for the interface, Archivo for article
         titles and the nav caps) are bundled from @fontsource in main.tsx
         rather than linked from Google Fonts, so a page load sends no
         visitor's IP address to a third party. -->

    <!--
      Theme applied before first paint.

      This has to be a blocking inline script rather than a React effect: an
      effect runs after the first paint, so a reader on the dark theme gets a
      full-screen flash of the light ground on every load. Kept in sync with
      `src/lib/theme.ts`, which owns the same storage key.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("youth.theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
